name: QEC-ADA correctness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qec-ada-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout QEC-ADA (reviewed checkout v4.2.2 SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout independently pinned public QEC donor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: QSOLKCB/QEC
          ref: 27bbc798c4e38138ca5b0fff70b15c3271a1917d
          path: .donor-qec
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
          persist-credentials: false
          fetch-depth: 1

      - name: Check local mirrored bytes and SHA-256 inventory
        run: python3 scripts/qecada.py verify

      - name: Independently validate donor Git tree and SHA-256 bytes
        run: python3 scripts/verify_donor.py --donor .donor-qec

      - name: Test path containment, document safety and CLI
        run: python3 -m unittest discover -s tests -v

      - name: Install native Ada toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild

      - name: Build Ada project (not a formal proof)
        run: gprbuild -p -P qec_ada.gpr

      - name: Execute native finite-field selftest
        run: ./build/bin/qec_ada selftest

      - name: Exhaustive scalar versus OPT qutrit equivalence (3^10 inputs)
        run: ./build/bin/qec_ada selftest qutrit

      - name: Configurable decoder snapshot/OPT exhaustive selftest
        run: ./build/bin/qec_ada selftest config

      - name: Native deterministic route selftest
        run: ./build/bin/qec_ada selftest route

      - name: Re-run tests against native CLI binary
        run: python3 -m unittest discover -s tests -v

      - name: Native research CLI regression tests (Tanner and Strowger)
        run: python3 -m unittest discover -s tests -v

      - name: End-to-end canonical Strowger and SPECTRAL WAV/manifest CLI
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          python3 scripts/strowger_receipt.py create "$out/route.json" \
            1020 3333 1100 0100 0010 none --request-id ci-route --epoch 7
          python3 scripts/strowger_receipt.py verify "$out/route.json"
          python3 scripts/tanner_spectral_export.py \
            2 1100 0012 --output "$out/tanner.json"
          python3 scripts/tanner_sonify.py \
            2 1100 0012 --wav "$out/tanner.wav" \
            --manifest "$out/tanner.manifest.json"

      - name: Native sparse NB eigenmode, IPR and SCC oracle suite
        run: python3 -m unittest discover -s tests -p test_phase1d.py -v

      - name: Native spectral receipts and forgery-resistant offline replay
        run: python3 -m unittest discover -s tests -p test_phase1d_receipts.py -v

      - name: End-to-end bounded spectrum JSON creation and replay
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          python3 scripts/nb_spectral_export.py create "$out/k23.json" \
            3 111000 000111
          python3 scripts/nb_spectral_export.py verify "$out/k23.json"
          python3 scripts/nb_spectral_export.py create "$out/cycle6.json" \
            3 110000 011000 101000
          python3 scripts/nb_spectral_export.py verify "$out/cycle6.json"

      - name: Scaled native sparse spectral analytic and memory-capacity tests
        run: python3 -m unittest discover -s tests -p test_phase1e_scale.py -v

      - name: Controlled binary BP experiments and graph-blocked evidence replay
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          python3 -m unittest discover -s tests -p test_phase1e_bp.py -v
          python3 scripts/phase1e_experiment.py run "$out/phase1e.json" \
            --graphs 12 --trials 6 --variables 24 --checks 16 \
            --seed qecada-phase1e-001 --noise-bps 400,800,1200
          python3 scripts/phase1e_experiment.py verify "$out/phase1e.json"
          sha256sum "$out/phase1e.json"

      - name: Observational paired OPT benchmark (no speedup gate)
        run: python3 scripts/bench_qutrit.py --trials 7

      - name: Negative-input smoke test
        run: |
          if ./build/bin/qec_ada gf3 add 3 0; then
            echo "invalid trit accepted" >&2
            exit 1
          fi
