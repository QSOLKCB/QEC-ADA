name: QEC-ADA correctness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qec-ada-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout QEC-ADA (reviewed checkout v4.2.2 SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout independently pinned public QEC donor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: QSOLKCB/QEC
          ref: 27bbc798c4e38138ca5b0fff70b15c3271a1917d
          path: .donor-qec
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
          persist-credentials: false
          fetch-depth: 1

      - name: Check local mirrored bytes and SHA-256 inventory
        run: python3 scripts/qecada.py verify

      - name: Independently validate donor Git tree and SHA-256 bytes
        run: python3 scripts/verify_donor.py --donor .donor-qec

      - name: Test path containment, document safety and CLI
        run: python3 -m unittest discover -s tests -v

      - name: Install native Ada toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild

      - name: Build Ada project (not a formal proof)
        run: gprbuild -p -P qec_ada.gpr

      - name: Execute native finite-field selftest
        run: ./build/bin/qec_ada selftest

      - name: Exhaustive scalar versus OPT qutrit equivalence (3^10 inputs)
        run: ./build/bin/qec_ada selftest qutrit

      - name: Configurable decoder snapshot/OPT exhaustive selftest
        run: ./build/bin/qec_ada selftest config

      - name: Native deterministic route selftest
        run: ./build/bin/qec_ada selftest route

      - name: Re-run tests against native CLI binary
        run: python3 -m unittest discover -s tests -v

      - name: Native research CLI regression tests (Tanner and Strowger)
        run: python3 -m unittest discover -s tests -v

      - name: End-to-end canonical Strowger and SPECTRAL WAV/manifest CLI
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          python3 scripts/strowger_receipt.py create "$out/route.json" \
            1020 3333 1100 0100 0010 none --request-id ci-route --epoch 7
          python3 scripts/strowger_receipt.py verify "$out/route.json"
          python3 scripts/tanner_spectral_export.py \
            2 1100 0012 --output "$out/tanner.json"
          python3 scripts/tanner_sonify.py \
            2 1100 0012 --wav "$out/tanner.wav" \
            --manifest "$out/tanner.manifest.json"

      - name: Native sparse NB eigenmode, IPR and SCC oracle suite
        run: python3 -m unittest discover -s tests -p test_phase1d.py -v

      - name: Native spectral receipts and forgery-resistant offline replay
        run: python3 -m unittest discover -s tests -p test_phase1d_receipts.py -v

      - name: End-to-end bounded spectrum JSON creation and replay
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          python3 scripts/nb_spectral_export.py create "$out/k23.json" \
            3 111000 000111
          python3 scripts/nb_spectral_export.py verify "$out/k23.json"
          python3 scripts/nb_spectral_export.py create "$out/cycle6.json" \
            3 110000 011000 101000
          python3 scripts/nb_spectral_export.py verify "$out/cycle6.json"

      - name: Scaled native sparse spectral analytic and memory-capacity tests
        run: python3 -m unittest discover -s tests -p test_phase1e_scale.py -v

      - name: Controlled binary BP experiments and graph-blocked evidence replay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_phase1e_bp.py -v
          mkdir -p evidence/phase1e
          python3 scripts/phase1e_experiment.py run evidence/phase1e/evidence.json \
            --graphs 20 --trials 12 --variables 32 --checks 24 \
            --seed qecada-phase1e-001 --noise-bps 400,800,1200
          python3 scripts/phase1e_experiment.py verify evidence/phase1e/evidence.json
          sha256sum evidence/phase1e/evidence.json

      - name: Phase 1F deterministic graph-cluster uncertainty and offline replay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_phase1f_inference.py -v
          mkdir -p evidence/phase1f
          python3 scripts/phase1f_blocked_inference.py create \
            evidence/phase1e/evidence.json evidence/phase1f/inference.json \
            --resamples 512
          python3 scripts/phase1f_blocked_inference.py verify \
            evidence/phase1e/evidence.json evidence/phase1f/inference.json
          sha256sum evidence/phase1f/inference.json

      - name: Prespecified Phase 1F replication cohort (40 distinct synthetic graphs)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase1e_experiment.py run \
            evidence/phase1f/cohort40.json \
            --graphs 40 --trials 12 --variables 32 --checks 24 \
            --seed qecada-phase1f-cohort40-001 --noise-bps 400,800,1200
          python3 scripts/phase1e_experiment.py verify \
            evidence/phase1f/cohort40.json
          python3 scripts/phase1f_blocked_inference.py create \
            evidence/phase1f/cohort40.json \
            evidence/phase1f/cohort40-inference.json --resamples 512
          python3 scripts/phase1f_blocked_inference.py verify \
            evidence/phase1f/cohort40.json \
            evidence/phase1f/cohort40-inference.json
          sha256sum evidence/phase1f/cohort40.json \
            evidence/phase1f/cohort40-inference.json

      - name: Retain independent-seed Phase 1F replication cohort (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qec-ada-phase1f-cohort40-${{ github.sha }}
          path: |
            evidence/phase1f/cohort40.json
            evidence/phase1f/cohort40-inference.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain Phase 1F graph-blocked uncertainty (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qec-ada-phase1f-blocked-${{ github.sha }}
          path: evidence/phase1f/inference.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain synthetic Phase 1E research evidence (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qec-ada-phase1e-${{ github.sha }}
          path: evidence/phase1e/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify native post-exec VmHWM measurement and sparse memory scaling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_phase1e_memory.py -v
          python3 scripts/phase1e_memory.py --checks 8 --variables 16
          python3 scripts/phase1e_memory.py --checks 16 --variables 24
          python3 scripts/phase1e_memory.py --checks 32 --variables 64

      - name: Checkout pinned QEC reference BP source (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: QSOLKCB/QEC
          ref: 27bbc798c4e38138ca5b0fff70b15c3271a1917d
          path: .donor-qec-bp
          sparse-checkout: |
            src/qec_qldpc_codes.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      - name: Install NumPy for opt-in pinned QEC reference only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y python3-numpy
          python3 -c 'import numpy; print("QEC reference NumPy:",numpy.__version__)'

      - name: Execute actual pinned QEC BP and verify direct rerun
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase1f_qec_bp_bridge.py create \
            evidence/phase1e/evidence.json evidence/phase1f/qec-bp.json \
            --donor .donor-qec-bp --trials-per-graph 2 --execute-pinned-donor
          python3 scripts/phase1f_qec_bp_bridge.py verify \
            evidence/phase1e/evidence.json evidence/phase1f/qec-bp.json \
            --donor .donor-qec-bp --execute-pinned-donor
          python3 -m unittest discover -s tests -p test_phase1f_qec_bp.py -v
          sha256sum evidence/phase1f/qec-bp.json

      - name: Retain pinned QEC cross-decoder comparison (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qec-ada-phase1f-qec-bp-${{ github.sha }}
          path: evidence/phase1f/qec-bp.json
          if-no-files-found: error
          retention-days: 30

      - name: Phase 1G pinned QEC CSS code-family holdout and BP cohort
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/phase1g
          python3 scripts/phase1g_pinned_css.py create \
            evidence/phase1g/qec_css.json \
            --donor .donor-qec-bp --execute-pinned-donor
          python3 scripts/phase1g_pinned_css.py verify \
            evidence/phase1g/qec_css.json \
            --donor .donor-qec-bp --execute-pinned-donor
          python3 -m unittest discover -s tests -p test_phase1g.py -v
          sha256sum evidence/phase1g/qec_css.json

      - name: Retain Phase 1G pinned CSS topology and cross-BP evidence (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qec-ada-phase1g-css-${{ github.sha }}
          path: evidence/phase1g/qec_css.json
          if-no-files-found: error
          retention-days: 30

      - name: Read-only checkout Simula UiB NISQEC matrix dataset (CC-BY-4.0)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Simula-UiB/nisqec
          ref: 913e0f26b07919ab73d7052159196599d34a2969
          path: .donor-nisqec
          sparse-checkout: |
            QT/Tan2TNCb_10_2_32
            QT/Tan2TNCb_45_7_80
          sparse-checkout-cone-mode: true
          persist-credentials: false
          fetch-depth: 1

      - name: Read-only checkout explicit QLDPC matrix source (licence unspecified)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lilyxy/Check-weight-constrained-quantum-codes
          ref: 0e6c3e281fe044315286fbdcf5295cb16f47f90d
          path: .donor-explicit-qldpc
          sparse-checkout: |
            codes/hgp
            codes/bivariate_bicycle
            codes/lifted_product
          sparse-checkout-cone-mode: true
          persist-credentials: false
          fetch-depth: 1

      - name: Pinned external QLDPC CSS pairs and publisher-blocked evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/phase1h
          python3 scripts/phase1h_external_css.py create \
            evidence/phase1h/external_css.json \
            --simula .donor-nisqec --explicit .donor-explicit-qldpc \
            --qec .donor-qec-bp --execute-pinned-qec
          python3 scripts/phase1h_external_css.py verify \
            evidence/phase1h/external_css.json \
            --simula .donor-nisqec --explicit .donor-explicit-qldpc \
            --qec .donor-qec-bp --execute-pinned-qec
          python3 -m unittest discover -s tests -p test_phase1h.py -v
          sha256sum evidence/phase1h/external_css.json

      - name: Retain derived-only external CSS research evidence (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qec-ada-phase1h-${{ github.sha }}
          path: evidence/phase1h/external_css.json
          if-no-files-found: error
          retention-days: 30

      - name: Observational paired OPT benchmark (no speedup gate)
        run: python3 scripts/bench_qutrit.py --trials 7

      - name: Negative-input smoke test
        run: |
          if ./build/bin/qec_ada gf3 add 3 0; then
            echo "invalid trit accepted" >&2
            exit 1
          fi
